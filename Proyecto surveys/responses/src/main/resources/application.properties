spring.application.name=responses
server.port=8083

# PostgreSQL BBDD
spring.datasource.url=jdbc:postgresql://localhost:5432/responsesDB
spring.datasource.username=postgres
spring.datasource.password=apertura15

# Hibernate configuration (database management)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# Show error messages in the body during development
spring.web.error.include-message=always

# JWT Security (same shared secret as the other microservices)
jwt.secret=0123456789ABCDEFGHIJKLMNOPQRSTUV

# Downstream microservices
surveys.base-url=http://localhost:8082/api