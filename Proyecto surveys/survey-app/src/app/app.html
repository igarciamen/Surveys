<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/surveys">Public Surveys</a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" routerLink="/surveys" routerLinkActive="active">
            Surveys
          </a>
        </li>

        @if (auth.hasRole('ROLE_DESIGNER') || auth.hasRole('ROLE_ADMIN')) {
        <li class="nav-item">
          <a class="nav-link" routerLink="/surveys/new" routerLinkActive="active">
            New survey
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/surveys/manage" routerLinkActive="active">
            My surveys
          </a>
        </li>
        }
      </ul>

      <ul class="navbar-nav ms-auto">
        @if (!auth.isAuthenticated()) {
        <li class="nav-item">
          <a class="nav-link" routerLink="/login" routerLinkActive="active">
            Login
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/signup" routerLinkActive="active">
            Sign Up
          </a>
        </li>
        }

        @if (auth.isAuthenticated()) {
        <li class="nav-item dropdown">
          <a
            class="nav-link dropdown-toggle"
            href="#"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            {{ username$ | async }}
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <a
                class="dropdown-item"
                style="cursor: pointer"
                (click)="onLogout($event)"
              >
                Logout
              </a>
            </li>
          </ul>
        </li>
        }
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid">
  <router-outlet></router-outlet>
</div>
