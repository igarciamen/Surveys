spring.application.name=invitations
server.port=8085

# PostgreSQL BBDD
spring.datasource.url=jdbc:postgresql://localhost:5432/invitationsSurveyDB
spring.datasource.username=postgres
spring.datasource.password=apertura15

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

# Show error messages in the body during development
spring.web.error.include-message=always

# JWT Security (same shared secret as the other microservices)
jwt.secret=0123456789ABCDEFGHIJKLMNOPQRSTUV

# Downstream microservice (surveys: owner check + survey title)
surveys.base-url=http://localhost:8082/api

notifications.base-url=http://localhost:8086/api
frontend.base-url=http://localhost:4200
