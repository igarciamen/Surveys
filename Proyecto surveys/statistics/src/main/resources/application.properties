spring.application.name=statistics
server.port=8084

# Show error messages in the body during development
spring.web.error.include-message=always

# JWT Security (same shared secret as the other microservices)
jwt.secret=0123456789ABCDEFGHIJKLMNOPQRSTUV

# Downstream microservice (responses provides aggregated results and timestamps)
responses.base-url=http://localhost:8083/api
