<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
</head>
<body style="margin:0; padding:0; background:#f3f4f6; font-family:Arial, sans-serif;">
<div style="max-width:600px; margin:24px auto; background:#ffffff; border-radius:10px; overflow:hidden; border:1px solid #e3e8ef;">
    <div style="background:#004494; padding:18px 24px;">
        <h2 style="margin:0; color:#ffffff;">EUSurvey</h2>
    </div>
    <div style="padding:24px; color:#1f2937;">
        <p style="margin:0 0 8px;">You have been invited to answer the following survey:</p>
        <p style="font-size:18px; font-weight:bold; color:#00256b; margin:0 0 20px;"
           th:text="${surveyTitle}">Survey title</p>
        <p style="margin:0 0 24px;">
            <a th:href="${inviteUrl}"
               style="background:#004494; color:#ffffff; padding:12px 22px; text-decoration:none; border-radius:6px; display:inline-block;">
                Answer the survey
            </a>
        </p>
        <p style="font-size:12px; color:#6b7280; margin:0;">
            If the button does not work, copy and paste this link into your browser:<br/>
            <span th:text="${inviteUrl}">https://...</span>
        </p>
    </div>
    <div style="background:#f9fafb; padding:12px 24px; border-top:1px solid #e3e8ef;">
        <p style="font-size:11px; color:#9aa4b2; margin:0;">This is an automated message from EUSurvey.</p>
    </div>
</div>
</body>
</html>
