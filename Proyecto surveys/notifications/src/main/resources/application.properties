spring.application.name=notifications
server.port=8086

# ---- Gmail SMTP ----
# Use a Gmail "App Password" (not your normal password) and inject the
# credentials as environment variables MAIL_USERNAME / MAIL_PASSWORD.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Show error messages in the body during development
spring.web.error.include-message=always

# JWT Security (same shared secret as the other microservices)
jwt.secret=0123456789ABCDEFGHIJKLMNOPQRSTUV
