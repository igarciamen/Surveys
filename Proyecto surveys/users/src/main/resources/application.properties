spring.application.name=users
server.port=8081

# PostgreSQL BBDD
spring.datasource.url=jdbc:postgresql://localhost:5432/usersurveyDB
spring.datasource.username=postgres
spring.datasource.password=apertura15

# Hibernate configuration (database management)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# JWT Security (same shared secret as the other microservices)
jwt.secret=0123456789ABCDEFGHIJKLMNOPQRSTUV
jwt.expirationMs=86400000

# Initial admin (seeded by DataLoader)
app.admin.username=admin
app.admin.password=admin123

