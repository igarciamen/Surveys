spring.application.name=surveys
server.port=8082

# PostgreSQL BBDD
spring.datasource.url=jdbc:postgresql://localhost:5432/surveysDB
spring.datasource.username=postgres
spring.datasource.password=apertura15

# Hibernate configuration (database management)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# JWT Security (same shared secret as the other microservices)
jwt.secret=0123456789ABCDEFGHIJKLMNOPQRSTUV

# Downstream microservices
users.base-url=http://localhost:8081/api

# Auto-close scheduled task (intervals in milliseconds)
surveys.autoclose.initial-delay-ms=10000
surveys.autoclose.interval-ms=60000
